<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Profile | SOS Guard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="navbar.css">

<style>
:root{
  --accent:#00e5ff;--bg1:#020617;--bg2:#0f172a;
  --safe:#22c55e;--warn:#facc15;--muted:#94a3b8;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins}
body{min-height:100vh;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:#fff;padding-top:90px}
.container{padding:40px 8%;max-width:1200px;margin:auto}

.profile-card{background:#020617;border-radius:20px;padding:30px;display:grid;grid-template-columns:1fr 2fr;gap:30px;margin-bottom:40px;align-items:center}
.profile-left{text-align:center}
.avatar{width:150px;height:150px;border-radius:50%;object-fit:cover;border:3px solid var(--accent)}
.edit-photo{display:inline-block;margin-top:10px;padding:8px 18px;border-radius:20px;border:1px solid var(--accent);color:var(--accent);cursor:pointer;font-size:.8rem}

.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;margin-top:20px}
.info-item{border:1px solid #1e293b;padding:12px;border-radius:10px}
.info-item span{font-size:.75rem;color:var(--muted)}
.info-item input,.info-item select{width:100%;margin-top:6px;padding:6px;border-radius:6px;background:#020617;color:#fff;border:1px solid #1e293b}
#userEmail{opacity:.7;cursor:not-allowed}

.status-card{margin-top:20px;padding:15px;border:1px dashed #1e293b;border-radius:12px}
.status-remaining,.status-partial{color:var(--warn)}
.status-complete{color:var(--safe)}

.btn{padding:10px 22px;border-radius:30px;border:none;cursor:pointer;font-weight:600;background:var(--accent);color:#000}
.apply-msg{margin-top:8px;display:none;text-align:center}

.emergency-form{background:#020617;border-radius:20px;padding:30px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:20px}
.field label{font-size:.85rem;color:var(--muted)}
.field input,.field textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #1e293b;background:#020617;color:#fff}

footer{text-align:center;padding:20px;color:#64748b;margin-top:40px}
@media(max-width:900px){.profile-card{grid-template-columns:1fr}}
</style>
</head>

<body>

<!-- Navbar -->
<div id="navbar"></div>

<section class="container">
  <div class="profile-card">
    <div class="profile-left">
      <img src="images/default-avatar.png" id="profilePic" class="avatar" alt="Profile Photo">
      <br>
      <label class="edit-photo">
        Edit Photo <input type="file" id="photoInput" accept="image/*" hidden>
      </label>
    </div>

    <div class="profile-right">
      <div class="info-grid" style="margin-top:0">
        <div class="info-item"><span>Name</span><input id="userName"></div>
        <div class="info-item"><span>Email (System ID)</span><input id="userEmail" readonly></div>
      </div>

      <div class="info-grid">
        <div class="info-item"><span>Vehicle No</span><input id="vehicleNo"></div>
        <div class="info-item"><span>Vehicle Type</span>
          <select id="vehicleType"><option>Bike</option><option>Car</option><option>Auto</option></select>
        </div>
        <div class="info-item"><span>Blood Group</span>
          <select id="bloodGroup"><option>O+</option><option>A+</option><option>B+</option><option>AB+</option></select>
        </div>
      </div>

      <div class="status-card">Status: <span id="emergencyStatus" class="status-remaining">Remaining / Incomplete</span></div>
    </div>
  </div>

  <div class="emergency-form">
    <h3>Emergency Information</h3>
    <div class="form-grid">
      <div class="info-item"><span>Father Details</span><input id="fName"><input id="fMobile" style="margin-top:8px"></div>
      <div class="info-item"><span>Mother Details</span><input id="mName"><input id="mMobile" style="margin-top:8px"></div>
      <div class="field"><label>Alternate Contact</label><input id="altContact"></div>
      <div class="field"><label>Allergies</label><input id="allergies"></div>
      <div class="field" style="grid-column:1/-1"><label>Medical Information</label><textarea id="medical"></textarea></div>
    </div>
  </div>

  <div style="margin-top:30px;text-align:center">
    <button class="btn" id="applyBtn">Apply Changes</button>
    <div class="apply-msg" id="applyMsg"></div>
  </div>
</section>

<footer>© 2026 SOS Guard</footer>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script>
const firebaseConfig={apiKey:"AIzaSyB_dQqxZ0K943Z9bOoUYa89hXDrdNI3B5I",authDomain:"sos-iot-bf587.firebaseapp.com",databaseURL:"https://sos-iot-bf587-default-rtdb.firebaseio.com",projectId:"sos-iot-bf587"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);

const db=firebase.database(), auth=firebase.auth();
let photoBase64="", originalData={};

photoInput.onchange=()=>{
  const f=photoInput.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ profilePic.src=r.result; photoBase64=r.result; const nav=document.getElementById("navProfilePic"); if(nav) nav.src=r.result; };
  r.readAsDataURL(f);
};

function updateStatus(){
  const fields=[fName,fMobile,mName,mMobile,altContact,allergies,medical].map(x=>x.value.trim());
  const filled=fields.filter(Boolean).length;
  if(filled===0){emergencyStatus.textContent="Remaining / Incomplete";emergencyStatus.className="status-remaining";return"Remaining";}
  if(filled<fields.length){emergencyStatus.textContent="Partially Completed";emergencyStatus.className="status-partial";return"Partial";}
  emergencyStatus.textContent="Completed";emergencyStatus.className="status-complete";return"Completed";
}

applyBtn.onclick=()=>{
  const u=auth.currentUser; if(!u) return alert("Not logged in");
  const key=u.email.replace(/\./g,"_");

  const current={
    name:userName.value,vehicleNo:vehicleNo.value,vehicleType:vehicleType.value,bloodGroup:bloodGroup.value,
    fName:fName.value,fMobile:fMobile.value,mName:mName.value,mMobile:mMobile.value,altContact:altContact.value,allergies:allergies.value,medical:medical.value,
    photo:photoBase64||""
  };

  const changed = Object.keys(current).some(k => (current[k]||"") !== (originalData[k]||""));
  if(!changed){
    applyMsg.textContent="ℹ️ No changes to save";
    applyMsg.style.color="#facc15";
    applyMsg.style.display="block";
    return setTimeout(()=>applyMsg.style.display="none",2500);
  }

  db.ref("userdetails/"+key).set({
    email:u.email,...current,emergencyStatus:updateStatus(),updatedAt:Date.now()
  }).then(()=>{
    applyMsg.textContent="✔ Changes applied successfully";
    applyMsg.style.color="#22c55e";
    applyMsg.style.display="block";
    originalData={...current};
    setTimeout(()=>applyMsg.style.display="none",3000);
  });
};

function fetchData(email){
  const key=email.replace(/\./g,"_");
  db.ref("userdetails/"+key).once("value",s=>{
    if(!s.exists()) return;
    const d=s.val();
    userName.value=d.name||""; vehicleNo.value=d.vehicleNo||""; vehicleType.value=d.vehicleType||""; bloodGroup.value=d.bloodGroup||"";
    fName.value=d.fName||""; fMobile.value=d.fMobile||""; mName.value=d.mName||""; mMobile.value=d.mMobile||""; altContact.value=d.altContact||""; allergies.value=d.allergies||""; medical.value=d.medical||"";
    if(d.photo){ profilePic.src=d.photo; photoBase64=d.photo; const nav=document.getElementById("navProfilePic"); if(nav) nav.src=d.photo; }
    else profilePic.src="images/default-avatar.png";
    updateStatus();
    originalData={name:d.name||"",vehicleNo:d.vehicleNo||"",vehicleType:d.vehicleType||"",bloodGroup:d.bloodGroup||"",fName:d.fName||"",fMobile:d.fMobile||"",mName:d.mName||"",mMobile:d.mMobile||"",altContact:d.altContact||"",allergies:d.allergies||"",medical:d.medical||"",photo:d.photo||""};
  });
}

auth.onAuthStateChanged(u=>{
  if(u){ userEmail.value=u.email; fetchData(u.email); }
  else window.location.href="login.html";
});

fetch("navbar.html").then(r=>r.text()).then(h=>document.getElementById("navbar").innerHTML=h);
</script>
<script src="navbar.js"></script>

</body>
</html>
