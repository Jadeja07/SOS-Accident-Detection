<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>User Profile | SOS Guard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="navbar.css" />

<style>
:root{
  --accent:#00e5ff;
  --bg1:#020617;
  --bg2:#0f172a;
  --card:#020617;
  --border:#1e293b;
  --safe:#22c55e;
  --warn:#facc15;
  --muted:#94a3b8;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{
  min-height:100vh;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  color:#fff;
  padding-top:90px;
}
.container{
  max-width:1200px;
  margin:auto;
  padding:50px 8% 40px;
}

/* Profile */
.profile-card{
  background:var(--card);
  border-radius:20px;
  padding:32px;
  display:grid;
  grid-template-columns:1fr 2fr;
  gap:32px;
  margin-bottom:40px;
  border:1px solid var(--border);
}
.profile-left{text-align:center}
.avatar{
  width:150px;height:150px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid var(--accent);
  box-shadow:0 0 20px rgba(0,229,255,.25);
}
.edit-photo{
  display:inline-block;
  margin-top:12px;
  padding:8px 18px;
  border-radius:20px;
  border:1px solid var(--accent);
  color:var(--accent);
  cursor:pointer;
  font-size:.8rem;
  transition:.2s;
}
.edit-photo:hover{background:rgba(0,229,255,.1)}

.info-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
  margin-top:20px;
}
.info-item{
  border:1px solid var(--border);
  padding:14px;
  border-radius:12px;
}
.info-item span{font-size:.75rem;color:var(--muted)}
.info-item input,.info-item select{
  width:100%;
  margin-top:8px;
  padding:8px 10px;
  border-radius:8px;
  background:#020617;
  color:#fff;
  border:1px solid var(--border);
}
#userEmail{opacity:.7;cursor:not-allowed}

.status-card{
  margin-top:24px;
  padding:14px 16px;
  border:1px dashed var(--border);
  border-radius:12px;
}
.status-remaining,.status-partial{color:var(--warn)}
.status-complete{color:var(--safe)}

.emergency-form{
  background:var(--card);
  border-radius:20px;
  padding:32px;
  border:1px solid var(--border);
}
.emergency-form h3{color:var(--accent)}
.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:22px;
  margin-top:20px;
}
.field label{font-size:.8rem;color:var(--muted)}
.field input,.field textarea{
  width:100%;
  margin-top:6px;
  padding:10px 12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#020617;
  color:#fff;
}
.field textarea{min-height:110px;resize:none}

.actions{text-align:center;margin-top:32px}
.btn{
  padding:12px 28px;border-radius:30px;border:none;cursor:pointer;
  font-weight:600;background:var(--accent);color:#000
}
.apply-msg{margin-top:10px;display:none;text-align:center}

footer{
  text-align:center;
  padding:24px;
  color:#64748b;
  margin-top:50px;
  border-top:1px solid var(--border);
}
@media(max-width:900px){.profile-card{grid-template-columns:1fr}}
</style>
</head>

<body>

<div id="navbar"></div>
<script>
fetch("navbar.html")
  .then(r=>r.text())
  .then(html=>document.getElementById("navbar").innerHTML=html);
</script>

<main class="container">

<section class="profile-card">
  <div class="profile-left">
    <img src="images/default-avatar.png" id="profilePic" class="avatar">
    <br>
    <label class="edit-photo">
      Edit Photo <input type="file" id="photoInput" accept="image/*" hidden>
    </label>
  </div>

  <div>
    <div class="info-grid" style="margin-top:0">
      <div class="info-item"><span>Name</span><input id="userName"></div>
      <div class="info-item"><span>Email</span><input id="userEmail" readonly></div>
    </div>

    <div class="info-grid">
      <div class="info-item"><span>Vehicle No</span><input id="vehicleNo"></div>
      <div class="info-item"><span>Vehicle Type</span>
        <select id="vehicleType"><option>Bike</option><option>Car</option><option>Auto</option></select>
      </div>
      <div class="info-item"><span>Blood Group</span>
        <select id="bloodGroup">
          <option value="" disabled selected>Select blood group</option>
          <option>O+</option>
          <option>O-</option>
          <option>A+</option>
          <option>A-</option>
          <option>B+</option>
          <option>B-</option>
          <option>AB+</option>
          <option>AB-</option>
        </select>

        <!-- <select id="bloodGroup"><option>O+</option><option>A+</option><option>B+</option><option>AB+</option></select> -->
      </div>
    </div>

    <div class="status-card">
      Status: <span id="emergencyStatus" class="status-remaining">Remaining / Incomplete</span>
    </div>
  </div>
</section>
<section class="emergency-form">
  <h3>Emergency Information</h3>
  <div class="form-grid">
    <div class="info-item">
      <span>Father</span>
      <input id="fName" placeholder="Father's name">
      <input id="fMobile" placeholder="Father's mobile number" style="margin-top:8px">
    </div>
    <div class="info-item">
      <span>Mother</span>
      <input id="mName" placeholder="Mother's name">
      <input id="mMobile" placeholder="Mother's mobile number" style="margin-top:8px">
    </div>
    <div class="field">
      <label>Alternate Contact</label>
      <input id="altContact" placeholder="Alternate emergency contact number">
    </div>
    <div class="field">
      <label>Allergies</label>
      <input id="allergies" placeholder="e.g. Penicillin, Dust, None">
    </div>
    <div class="field" style="grid-column:1/-1">
      <label>Medical Info</label>
      <textarea id="medical" placeholder="Any medical conditions (asthma, diabetes, heart issues, etc.)"></textarea>
    </div>
  </div>
</section>

<div class="actions">
  <button class="btn" id="applyBtn">Apply Changes</button>
  <div class="apply-msg" id="applyMsg"></div>
</div>

</main>

<footer>© 2026 SOS Guard</footer>

<script>
let photoBase64="";

const initialState={};
window.addEventListener("DOMContentLoaded",()=>{
  ["userName","vehicleNo","vehicleType","bloodGroup","fName","fMobile","mName","mMobile","altContact","allergies","medical"]
  .forEach(id=>initialState[id]=document.getElementById(id).value);
});

photoInput.onchange=()=>{
  const r=new FileReader();
  r.onload=()=>{
    profilePic.src=r.result;
    photoBase64=r.result;
  };
  r.readAsDataURL(photoInput.files[0]);
};

function updateStatus(){
  const fields=[fName,fMobile,mName,mMobile,altContact,allergies,medical].map(x=>x.value.trim());
  const filled=fields.filter(v=>v).length;
  if(filled===0){emergencyStatus.textContent="Remaining / Incomplete";emergencyStatus.className="status-remaining";return}
  if(filled<fields.length){emergencyStatus.textContent="Partially Completed";emergencyStatus.className="status-partial";return}
  emergencyStatus.textContent="Completed";emergencyStatus.className="status-complete";
}

applyBtn.onclick=()=>{
  const current={
    userName:userName.value,vehicleNo:vehicleNo.value,vehicleType:vehicleType.value,bloodGroup:bloodGroup.value,
    fName:fName.value,fMobile:fMobile.value,mName:mName.value,mMobile:mMobile.value,
    altContact:altContact.value,allergies:allergies.value,medical:medical.value,photo:photoBase64
  };

  const changed=Object.keys(current).some(k=>(current[k]||"")!==(initialState[k]||""));
  if(!changed){
    applyMsg.textContent="ℹ️ No changes were made";
    applyMsg.style.color="#facc15";
    applyMsg.style.display="block";
    setTimeout(()=>applyMsg.style.display="none",2500);
    return;
  }

  Object.assign(initialState,current);
  updateStatus();

  applyMsg.textContent="✔ Changes applied successfully";
  applyMsg.style.color="#22c55e";
  applyMsg.style.display="block";
  setTimeout(()=>applyMsg.style.display="none",3000);
};
</script>

</body>
</html>
