<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SOS Guard | Live Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- Fonts & Chart -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<style>
:root{
  --accent:#00e5ff;
  --bg1:#020617;
  --bg2:#0f172a;
  --danger:#ef4444;
  --safe:#22c55e;
}
body{
  margin:0;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  color:#fff;
  font-family:Poppins;
  padding-top:90px;
}
.dashboard{padding:40px 8%}
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}
.card{
  background:#020617;
  padding:25px;
  border-radius:16px;
}
.value{
  font-size:2rem;
  font-weight:700;
  color:var(--accent);
}
.status-safe{color:var(--safe)}
.status-danger{color:var(--danger)}

.layout{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:20px;
  margin-top:30px;
}
.panel{
  background:#020617;
  border-radius:16px;
  padding:20px;
}
.map{
  height:350px;
  border-radius:12px;
}

.offline-theme{
  filter:grayscale(1);
  opacity:0.6;
}
.danger-theme{
  --accent:#ef4444;
}

@media(max-width:900px){
  .layout{grid-template-columns:1fr}
}
</style>
</head>

<body id="app">

  <!-- Navbar -->
  <div id="navbar"></div>

  <section class="dashboard">

    <div class="cards">
      <div class="card">
        <h3>Live Speed</h3>
        <div class="value" id="speedValue">0 km/h</div>
      </div>

      <div class="card">
        <h3>Vehicle Status</h3>
        <div class="value status-safe" id="vehicleStatus">NORMAL</div>
      </div>

      <div class="card">
        <h3>Accident Status</h3>
        <div class="value status-safe" id="accidentStatus">Safe</div>
      </div>

      <div class="card">
        <h3>Device Status</h3>
        <div class="value status-danger" id="deviceStatus">Offline</div>
      </div>
    </div>

    <div class="layout">
      <div class="panel">
        <h3 id="liveLocation">📍 Live Location</h3>
        <div class="map" id="mapBox"></div>
      </div>

      <div class="panel">
        <h3>📈 Speed Graph</h3>
        <canvas id="speedChart"></canvas>
      </div>
    </div>

  </section>

<script>
/* ================= FIREBASE INIT ================= */
const firebaseConfig = {
  apiKey: "AIzaSyB_dQqxZ0K943Z9bOoUYa89hXDrdNI3B5I",
  authDomain: "sos-iot-bf587.firebaseapp.com",
  databaseURL: "https://sos-iot-bf587-default-rtdb.firebaseio.com",
  projectId: "sos-iot-bf587"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}

const db = firebase.database();
const auth = firebase.auth();

/* ================= NAVBAR LOAD + PROFILE PHOTO ================= */
fetch("navbar.html")
  .then(res => res.text())
  .then(html => {
    document.getElementById("navbar").innerHTML = html;

    auth.onAuthStateChanged(user => {
      if (!user) return;

      const email = user.email;
      const key = email.replace(/\./g, "_");

      db.ref("userdetails/" + key + "/photo").once("value")
        .then(snap => {
          if (snap.exists()) {
            const photo = snap.val();
            const img = document.getElementById("navProfilePic");
            if (img && photo) img.src = photo;
          }
        });
    });
  });

/* ================= UI ================= */
const speedValue = document.getElementById("speedValue");
const vehicleStatus = document.getElementById("vehicleStatus");
const accidentStatus = document.getElementById("accidentStatus");
const deviceStatus = document.getElementById("deviceStatus");
const app = document.getElementById("app");
const liveLocationTitle = document.getElementById("liveLocation");

/* ================= CHART ================= */
const ctx = document.getElementById("speedChart").getContext("2d");
const speedChart = new Chart(ctx,{
  type:"line",
  data:{ labels:[], datasets:[{ data:[], borderColor:"#00e5ff", tension:0.4 }] },
  options:{ plugins:{ legend:{ display:false } } }
});

/* ================= MAP + LAST KNOWN CACHE ================= */
let map = null, marker = null;
let lastLat = Number(localStorage.getItem("lastLat")) || null;
let lastLng = Number(localStorage.getItem("lastLng")) || null;

function initMap(lat, lng){
  map = L.map("mapBox").setView([lat, lng], 15);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
  marker = L.marker([lat, lng]).addTo(map);
}

window.addEventListener("load", () => {
  if (lastLat && lastLng && !map) initMap(lastLat, lastLng);
});

/* ================= LIVE DATA ================= */
db.ref("Live").on("value", snap=>{
  if(!snap.exists()) return;
  const d = snap.val();

  const isOnline = d.device === "ONLINE";
  deviceStatus.innerText = isOnline ? "Online" : "Offline";
  deviceStatus.className = "value " + (isOnline ? "status-safe" : "status-danger");

  app.classList.toggle("offline-theme", !isOnline);
  liveLocationTitle.innerText = isOnline ? "📍 Live Location" : "📍 Last Known Location";

  const speed = Number(d.speed || 0);
  speedValue.innerText = speed.toFixed(1)+" km/h";

  const accident = d.accident === "UNSAFE";
  vehicleStatus.innerText = accident ? "CRITICAL" : (d.status || "NORMAL");
  vehicleStatus.className = "value " + (accident ? "status-danger" : "status-safe");

  accidentStatus.innerText = accident ? "Accident Detected" : "Safe";
  accidentStatus.className = "value " + (accident ? "status-danger" : "status-safe");

  app.classList.toggle("danger-theme", accident);

  const lat = Number(d.latitude);
  const lng = Number(d.longitude);

  if (!isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0) {
    lastLat = lat;
    lastLng = lng;
    localStorage.setItem("lastLat", lat);
    localStorage.setItem("lastLng", lng);
  }

  if (lastLat && lastLng) {
    if (!map) initMap(lastLat, lastLng);
    else {
      marker.setLatLng([lastLat, lastLng]);
      map.setView([lastLat, lastLng], map.getZoom());
    }
  }

  const t = new Date().toLocaleTimeString();
  speedChart.data.labels.push(t);
  speedChart.data.datasets[0].data.push(speed);
  if(speedChart.data.labels.length > 10){
    speedChart.data.labels.shift();
    speedChart.data.datasets[0].data.shift();
  }
  speedChart.update();
});

liveLocationTitle.onclick = () => {
  if(marker){
    const p = marker.getLatLng();
    window.open(`https://www.google.com/maps?q=${p.lat},${p.lng}`, "_blank");
  }
};
</script>

</body>
</html>
