<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact Us | SOS Guard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: #00e5ff;
      --bg1: #020617;
      --bg2: #0f172a;
      --danger: #ef4444;
      --muted: #94a3b8;
      --card: #020617;
      --border: #1e293b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      color: #fff;
      padding-top: 90px;
    }

    .container {
      padding: 60px 8%;
      max-width: 1200px;
      margin: auto;
    }

    .page-title {
      text-align: center;
      margin-bottom: 40px;
    }

    .page-title h2 {
      color: var(--accent);
      margin-bottom: 8px;
      font-size: 2.2rem;
    }

    .page-title p {
      color: var(--muted);
      max-width: 700px;
      margin: auto;
      font-size: 0.95rem;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 30px;
    }

    .contact-card {
      background: var(--card);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 0 30px rgba(0,229,255,0.12);
    }

    .contact-card h3 {
      color: var(--accent);
      margin-bottom: 15px;
    }

    .contact-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    .info-box {
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }

    .info-box span {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .emergency-note {
      background: linear-gradient(135deg, #140a0a, #2a0f0f);
      border: 1px dashed #3f1d1d;
      border-radius: 14px;
      padding: 16px;
      color: #fecaca;
      font-size: 0.85rem;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #020617;
      color: #fff;
      outline: none;
    }

    .form-group textarea {
      resize: none;
      min-height: 110px;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--accent);
    }

    .btn {
      padding: 10px 24px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      background: var(--accent);
      color: #000;
      transition: 0.3s;
    }

    .btn:hover {
      background: #00bcd4;
      transform: translateY(-2px);
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #64748b;
      margin-top: 50px;
    }

    @media(max-width: 900px) {
      .contact-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div id="navbar"></div>
<script>
  fetch("navbar.html")
    .then(res => res.text())
    .then(html => document.getElementById("navbar").innerHTML = html);
</script>

<section class="container">

  <div class="page-title">
    <h2>Get in Touch</h2>
    <p>
      Have questions, feedback, or want to collaborate? Reach out to the SOS Guard team.
    </p>
  </div>

  <div class="contact-grid">

    <div class="contact-card">
      <h3>Contact Information</h3>

      <div class="contact-info">
        <div class="info-box">
          <span>Email</span>
          <strong>support@sosguard.app</strong>
        </div>
        <div class="info-box">
          <span>Phone</span>
          <strong>+91 9XXXXXXXXX</strong>
        </div>
        <div class="info-box">
          <span>Location</span>
          <strong>Gujarat, India</strong>
        </div>
      </div>

      <div class="emergency-note">
        <strong>Emergency Notice:</strong> This form is for general support only.
      </div>
    </div>

    <div class="contact-card">
      <h3>Send Us a Message</h3>

      <form id="contactForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" required>
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" required>
        </div>

        <div class="form-group">
          <label>Subject</label>
          <input type="text" id="subject" required>
        </div>

        <div class="form-group">
          <label>Message</label>
          <textarea id="message" required></textarea>
        </div>

        <button type="submit" class="btn">Send Message</button>
      </form>
    </div>

  </div>
</section>

<footer>
  © 2026 SOS Guard | Contact
</footer>

<!-- 🔥 FINAL WORKING GOOGLE SHEET SCRIPT -->
<script>
  const scriptURL = "https://script.google.com/macros/s/AKfycbxYvJWAOYiuvYmhR8q8zx_FfDJNLAqQ4LilFz_GhP38WCV9ENOKBMc170WdIPe1V_Y/exec";

  document.getElementById("contactForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const formData = new FormData();
    formData.append("name", name.value);
    formData.append("email", email.value);
    formData.append("subject", subject.value);
    formData.append("message", message.value);

    fetch(scriptURL, {
      method: "POST",
      body: formData
    })
    .then(() => {
      alert("Message sent successfully ✅");
      this.reset();
    })
    .catch(() => {
      alert("Something went wrong ❌");
    });
  });
</script>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script>
/* FIREBASE INIT */
const firebaseConfig = {
  apiKey:"AIzaSyB_dQqxZ0K943Z9bOoUYa89hXDrdNI3B5I",
  authDomain:"sos-iot-bf587.firebaseapp.com",
  databaseURL:"https://sos-iot-bf587-default-rtdb.firebaseio.com",
  projectId:"sos-iot-bf587"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}

const db = firebase.database();
const auth = firebase.auth();

/* NAVBAR LOAD + PROFILE PHOTO (same as dashboard) */
fetch("navbar.html")
  .then(res => res.text())
  .then(html => {
    document.getElementById("navbar").innerHTML = html;

    auth.onAuthStateChanged(user => {
      if (!user) return;

      const email = user.email;
      const key = email.replace(/\./g, "_");

      db.ref("userdetails/" + key + "/photo").once("value")
        .then(snap => {
          if (snap.exists()) {
            const photo = snap.val();
            const img = document.getElementById("navProfilePic");
            if (img && photo) img.src = photo;
          }
        });
    });
  });
</script>

</body>
</html>
